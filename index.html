<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Herta Online - Fixed Assets</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #222; font-family: sans-serif; touch-action: none; }
        
        /* หน้า Login */
        #login-screen {
            position: fixed; inset: 0; background: #1a1a1a; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        #login-input { padding: 15px; font-size: 20px; border-radius: 10px; border: 2px solid #e74c3c; margin-bottom: 20px; text-align: center; background: #333; color: white; }
        #start-btn { padding: 15px 45px; background: #e74c3c; color: white; border: none; border-radius: 50px; font-size: 22px; font-weight: bold; cursor: pointer; }

        #money-display {
            position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.85);
            color: #ffd700; padding: 12px 25px; border-radius: 50px;
            font-size: 22px; font-weight: bold; border: 2px solid #ffd700; z-index: 80;
        }

        #viewport { position: relative; width: 100vw; height: 100vh; overflow: hidden; display: none; }
        #world { position: absolute; top: 0; left: 0; width: 5000px; height: 100%; background: linear-gradient(to bottom, #87CEEB 80%, #4CAF50 80%); }

        /* ตัวละคร */
        .player-node { position: absolute; bottom: 20%; width: 150px; display: flex; flex-direction: column; align-items: center; z-index: 10; transition: left 0.1s linear; }
        .player-node img { width: 150px; }
        .player-label { background: rgba(0,0,0,0.6); color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 5px; white-space: nowrap; }

        /* ตู้โชว์และกาชา */
        #showcase-obj { position: absolute; bottom: 20%; left: 600px; width: 280px; }
        #gacha-obj { position: absolute; bottom: 20%; left: 1800px; width: 250px; }

        .action-btn { position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%); padding: 15px 35px; background: #ff4757; color: white; border-radius: 50px; display: none; z-index: 60; border: 3px solid #fff; font-weight: bold; }
        
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        
        /* หน้าต่าง UI - ใช้ไฟล์ eng.png */
        #inventory-ui { width: 90%; height: 85%; background-image: url('eng.png'); background-size: 100% 100%; display: flex; flex-direction: column; align-items: center; padding-top: 60px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; width: 85%; height: 60%; overflow-y: auto; margin-top: 20px; }

        .slot-card { background: rgba(255,255,255,0.15); border: 2px solid rgba(255,215,0,0.3); border-radius: 10px; padding: 8px; text-align: center; }
        .slot-card img { width: 100%; height: 100px; object-fit: contain; border-radius: 5px; }

        /* การแสดงผลสุ่มกาชา */
        .gacha-result-card {
            width: 260px; height: 380px; background: #fff; border-radius: 20px;
            border: 8px solid #ffd700; display: flex; flex-direction: column; align-items: center;
            padding: 15px; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
        .gacha-result-card img { width: 100%; height: 70%; object-fit: contain; }

        .controls { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: space-around; z-index: 50; }
        .walk-btn { width: 75px; height: 75px; background: rgba(0,0,0,0.6); color: white; border-radius: 50%; border: 2px solid white; font-size: 30px; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1 style="color:#ffd700;">THE HERTA ONLINE</h1>
    <input type="text" id="login-input" placeholder="ใส่ชื่อ..." maxlength="10">
    <button id="start-btn">เริ่มเกม</button>
</div>

<div id="money-display">💰 Gold: <span id="money-val">0</span></div>

<div id="viewport">
    <div id="world">
        <img id="showcase-obj" src="png.png">
        <img id="gacha-obj" src="re.png">
    </div>
</div>

<button id="btn-gacha" class="action-btn">🎰 สุ่มการ์ด (50G)</button>
<button id="btn-showcase" class="action-btn">🖼️ เปิดตู้โชว์</button>

<div class="controls">
    <button class="walk-btn" id="leftBtn">◀</button>
    <button class="walk-btn" id="rightBtn">▶</button>
</div>

<div id="overlay-showcase" class="overlay">
    <div id="inventory-ui">
        <h2 style="color:white;">COLLECTION</h2>
        <div id="collection-grid" class="grid"></div>
        <button onclick="closeUI()" style="margin-top:20px; padding:10px 20px;">ปิดหน้าต่าง</button>
    </div>
</div>

<div id="overlay-gacha" class="overlay">
    <div id="gacha-result"></div>
    <div style="margin-top:20px; display:flex; gap:10px;">
        <button id="draw-btn" style="padding:15px 30px; background:#2ecc71; color:white; border:none; border-radius:10px;">สุ่มอีก (50G)</button>
        <button onclick="closeUI()" style="padding:15px 30px; background:#e74c3c; color:white; border:none; border-radius:10px;">ปิด</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://the-herta-cf467-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = "";
    let gold = 0;
    let inventory = [];
    let playerX = 300;
    let currentImg = "au.png";

    const cardPool = [
        { name: "The Herta", rarity: "SSR", income: 100, img: "The Herta.png" },
        { name: "Sparkle", rarity: "SSR", income: 100, img: "67.png" },
        { name: "Sparcy", rarity: "SR", income: 10, img: "Sparcy.png" },
        { name: "Mage", rarity: "SR", income: 10, img: "the.png" },
        { name: "JJK", rarity: "R", income: 1, img: "jjkl.png" }
    ];

    document.getElementById('start-btn').onclick = function() {
        myName = document.getElementById('login-input').value.trim();
        if(!myName) return alert("ใส่ชื่อด้วยจ้า!");
        document.getElementById('login-screen').style.display = "none";
        document.getElementById('viewport').style.display = "block";

        db.ref('users/' + myName).once('value', (s) => {
            const d = s.val();
            if(d) {
                gold = Number.isFinite(d.gold) ? d.gold : 100;
                inventory = d.inventory || [];
                playerX = d.x || 300;
            } else { gold = 100; }
            initGame();
        });
    };

    function initGame() {
        // Sync ตำแหน่งตัวเอง
        setInterval(() => {
            db.ref('users/' + myName).update({
                x: playerX, img: currentImg, gold: gold, inventory: inventory, lastSeen: Date.now()
            });
        }, 100);

        // Multiplayer ไม่กระพริบ
        db.ref('users').on('value', (snapshot) => {
            const users = snapshot.val();
            const world = document.getElementById('world');
            const now = Date.now();

            for(let id in users) {
                const u = users[id];
                if(now - u.lastSeen > 10000) {
                    const old = document.getElementById('p-' + id);
                    if(old) old.remove();
                    continue;
                }
                let pDiv = document.getElementById('p-' + id);
                if(!pDiv) {
                    pDiv = document.createElement('div');
                    pDiv.id = 'p-' + id; pDiv.className = 'player-node';
                    pDiv.innerHTML = `<div class="player-label">${id}</div><img src="${u.img}">`;
                    world.appendChild(pDiv);
                }
                pDiv.style.left = u.x + "px";
                pDiv.querySelector('img').src = u.img;
            }
            const camX = (window.innerWidth/2 - (playerX + 75));
            world.style.left = camX + "px";
            document.getElementById('money-val').innerText = gold.toLocaleString();
            document.getElementById('btn-showcase').style.display = Math.abs(playerX - 600) < 150 ? "block" : "none";
            document.getElementById('btn-gacha').style.display = Math.abs(playerX - 1800) < 150 ? "block" : "none";
        });

        // รายได้จากการ์ด
        setInterval(() => {
            let total = 0;
            inventory.forEach(i => total += i.income);
            if(total > 0) { gold += total; document.getElementById('money-val').innerText = gold.toLocaleString(); }
        }, 3000);
    }

    // ระบบเดิน
    let walkInterval = null;
    function startWalk(dir) {
        if(walkInterval) return;
        walkInterval = setInterval(() => {
            if(dir === 'L') { playerX -= 15; currentImg = "ap.png"; }
            else { playerX += 15; currentImg = "as.png"; }
            if(playerX < 0) playerX = 0;
            if(playerX > 4800) playerX = 4800;
        }, 40);
    }
    function stopWalk() { clearInterval(walkInterval); walkInterval = null; currentImg = "au.png"; }
    document.getElementById('leftBtn').onpointerdown = () => startWalk('L');
    document.getElementById('rightBtn').onpointerdown = () => startWalk('R');
    window.onpointerup = stopWalk;

    // ระบบสุ่ม
    document.getElementById('draw-btn').onclick = () => {
        if(gold < 50) return alert("ทองไม่พอ!");
        gold -= 50;
        const res = cardPool[Math.floor(Math.random() * cardPool.length)];
        inventory.push(res);
        document.getElementById('gacha-result').innerHTML = `
            <div class="gacha-result-card">
                <img src="${res.img}">
                <h3>${res.name}</h3>
                <h2 style="color:gold">${res.rarity}</h2>
                <p style="color:#666">+${res.income} Gold</p>
            </div>`;
    };

    // เปิดตู้โชว์
    function openShowcase() {
        const grid = document.getElementById('collection-grid');
        grid.innerHTML = "";
        inventory.forEach(item => {
            grid.innerHTML += `
                <div class="slot-card">
                    <img src="${item.img}">
                    <div style="color:gold; font-size:10px; font-weight:bold;">${item.rarity}</div>
                </div>`;
        });
        document.getElementById('overlay-showcase').style.display = "flex";
    }

    document.getElementById('btn-gacha').onclick = () => {
        document.getElementById('gacha-result').innerHTML = "<h2 style='color:white'>พร้อมเสี่ยงโชคหรือยัง?</h2>";
        document.getElementById('overlay-gacha').style.display = "flex";
    };
    document.getElementById('btn-showcase').onclick = openShowcase;
    window.closeUI = () => { document.querySelectorAll('.overlay').forEach(e => e.style.display="none"); };
</script>
</body>
</html>
