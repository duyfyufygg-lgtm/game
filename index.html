<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Herta Online - Massive Collection Update</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #1a0a2e; font-family: 'Courier New', Courier, monospace; touch-action: none; color: white; }
        
        /* หน้า Login */
        #login-screen {
            position: fixed; inset: 0; background: radial-gradient(circle, #2e1a47 0%, #1a0a2e 100%); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #login-input { padding: 15px; font-size: 20px; border-radius: 10px; border: 2px solid #ff4757; margin-bottom: 20px; text-align: center; background: #333; color: white; box-shadow: 0 0 10px rgba(255,71,87,0.5); }
        #start-btn { padding: 15px 45px; background: #ff4757; color: white; border: none; border-radius: 50px; font-size: 22px; font-weight: bold; cursor: pointer; transition: all 0.2s; box-shadow: 0 5px 15px rgba(255,71,87,0.4); }
        #start-btn:active { transform: translateY(2px); box-shadow: 0 2px 10px rgba(255,71,87,0.4); }

        /* UI แสดงเงิน */
        #money-display {
            position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.8);
            color: #ffd700; padding: 12px 25px; border-radius: 50px;
            font-size: 22px; font-weight: bold; border: 2px solid #ffd700; z-index: 80;
            box-shadow: 0 0 15px rgba(255,215,0,0.5); text-shadow: 0 0 5px rgba(255,215,0,0.5);
        }

        /* โลกเกม */
        #viewport { position: relative; width: 100vw; height: 100vh; overflow: hidden; display: none; }
        #world { position: absolute; top: 0; left: 0; width: 5000px; height: 100%; background: linear-gradient(to bottom, #1a0a2e 0%, #2e1a47 70%, #1a0a2e 100%); }

        /* ตัวละคร */
        .player-node { position: absolute; bottom: 20%; width: 150px; display: flex; flex-direction: column; align-items: center; z-index: 10; transition: left 0.1s linear; }
        .player-node img { width: 150px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }
        .player-label { background: rgba(0,0,0,0.7); color: white; padding: 3px 10px; border-radius: 5px; font-size: 14px; margin-bottom: 5px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.3); }

        /* วัตถุในโลก */
        #showcase-obj { position: absolute; bottom: 20%; left: 600px; width: 280px; filter: drop-shadow(0 0 15px gold); }
        #gacha-obj { position: absolute; bottom: 20%; left: 1800px; width: 250px; filter: drop-shadow(0 0 20px #ff4757); }

        /* ปุ่ม Action */
        .action-btn { position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%); padding: 18px 40px; background: #ff4757; color: white; border-radius: 50px; display: none; z-index: 60; border: 3px solid #fff; font-weight: bold; font-size: 18px; box-shadow: 0 0 20px rgba(255,71,87,0.6); }
        
        /* หน้าต่าง Overlay */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(5px); }
        
        /* หน้าต่างคอลเลกชัน */
        #inventory-ui { width: 92%; height: 88%; background-image: url('eng.png'); background-size: 100% 100%; display: flex; flex-direction: column; align-items: center; padding-top: 50px; border: 2px solid gold; border-radius: 20px; box-shadow: 0 0 30px rgba(255,215,0,0.3); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 18px; width: 88%; height: 65%; overflow-y: auto; margin-top: 20px; padding: 10px; }
        .slot-card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 10px; text-align: center; transition: all 0.2s; }
        .slot-card:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
        .slot-card img { width: 100%; height: 110px; object-fit: contain; border-radius: 8px; }

        /* หน้าต่างสุ่มกาชา */
        .gacha-result-card {
            width: 280px; height: 400px; background: #222; border-radius: 25px;
            border: 8px solid #ffd700; display: flex; flex-direction: column; align-items: center;
            padding: 20px; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 40px rgba(255,215,0,0.5); color: white;
        }
        @keyframes pop { from { transform: scale(0) rotate(-10deg); } to { transform: scale(1) rotate(0deg); } }
        .gacha-result-card img { width: 100%; height: 75%; object-fit: contain; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        .gacha-result-card h3 { margin: 15px 0 5px 0; font-size: 18px; }
        .gacha-result-card h2 { margin: 0; font-size: 28px; text-shadow: 0 0 10px currentColor; }
        .gacha-result-card p { margin: 5px 0 0 0; font-size: 14px; color: #aaa; }

        /* ปุ่มควบคุมการเดิน */
        .controls { position: fixed; bottom: 40px; width: 100%; display: flex; justify-content: space-around; z-index: 50; padding: 0 20px; box-sizing: border-radius; }
        .walk-btn { width: 85px; height: 85px; background: rgba(0,0,0,0.7); color: white; border-radius: 50%; border: 3px solid rgba(255,255,255,0.5); font-size: 35px; box-shadow: 0 0 15px rgba(0,0,0,0.5); -webkit-user-select: none; user-select: none; }
        .walk-btn:active { background: rgba(255,71,87,0.6); border-color: #fff; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1 style="color:#ffd700; text-shadow: 0 0 15px gold; font-size: 35px;">THE HERTA ONLINE</h1>
    <h3 style="color:#aaa; margin-top: -10px;">Massive Collection Update</h3>
    <input type="text" id="login-input" placeholder="Enter Your Name..." maxlength="10">
    <button id="start-btn">LOGIN</button>
</div>

<div id="money-display">💰 Gold: <span id="money-val">0</span></div>

<div id="viewport">
    <div id="world">
        <img id="showcase-obj" src="png.png" alt="Showcase">
        <img id="gacha-obj" src="re.png" alt="Gacha Machine">
    </div>
</div>

<button id="btn-gacha" class="action-btn">🎰 GACHA DRAW (50G)</button>
<button id="btn-showcase" class="action-btn">🖼️ OPEN SHOWCASE</button>

<div class="controls">
    <button class="walk-btn" id="leftBtn">◀</button>
    <button class="walk-btn" id="rightBtn">▶</button>
</div>

<div id="overlay-showcase" class="overlay">
    <div id="inventory-ui">
        <h2 style="color:white; text-shadow: 2px 2px 4px #000; font-size: 28px; margin-bottom: 10px;">MY COLLECTION</h2>
        <div id="collection-grid" class="grid"></div>
        <button onclick="closeUI()" style="margin-top:25px; padding:12px 30px; border-radius:20px; border:none; background:#e74c3c; color:white; font-weight:bold; cursor:pointer;">CLOSE</button>
    </div>
</div>

<div id="overlay-gacha" class="overlay">
    <div id="gacha-result"></div>
    <div style="margin-top:25px; display:flex; gap:15px;">
        <button id="draw-btn" style="padding:18px 35px; background:#2ecc71; color:white; border:none; border-radius:12px; font-weight:bold; font-size:16px; cursor:pointer; box-shadow: 0 5px 15px rgba(46,204,113,0.3);">DRAW AGAIN (50G)</button>
        <button onclick="closeUI()" style="padding:18px 35px; background:#e74c3c; color:white; border:none; border-radius:12px; font-size:16px; cursor:pointer;">EXIT</button>
    </div>
</div>

<script>
    // --- ตัวแปรต้นฉบับ (ห้ามลบ) ---
    // au.png, png.png, re.png, eng.png, ap.png, as.png, The Herta.png, 67.png, Sparcy.png, the.png, jjkl.png, ki.jpeg, kj.jpeg, 1000029759.png, 1000029690.png, เจม.png, เจดี.png, เอ.png, เด.png, เก.png, gf.png, ai.png, 55.png, ko.png, li.png, mo.png, mk.png, lo.png, mpo.png, pgn.png, pnm.png, po.png, red.png

    // --- Firebase Configuration (คงเดิมจากของคุณ) ---
    const firebaseConfig = { databaseURL: "https://the-herta-cf467-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // สถานะผู้เล่น
    let myName = "";
    let gold = 0;
    let inventory = [];
    let playerX = 300;
    let currentImg = "au.png"; // รูปยืนนิ่งปกติ

    // --- ตู้กาชา (Card Pool) - อัปเดตใหม่เอี่ยม! ---
    // จัดระดับความแรร์ (UR, SSR, SR, R) และ Passive Income
    const cardPool = [
        // --- ระดับ UR (Ultra Rare) - โอกาสออก 3% | Income: +250G ---
        { name: "Hanabi (Masked)", rarity: "UR", income: 250, img: "1000029759.png", color: "#ff4757" }, // ใหม่! ร่างแดงสวมหน้ากาก
        { name: "Blood Moon Red", rarity: "UR", income: 230, img: "red.png", color: "#ff4757" }, // ใหม่!

        // --- ระดับ SSR (Super Special Rare) - โอกาสออก 12% | Income: +100G ขึ้นไป ---
        { name: "Luna EX Form", rarity: "SSR", income: 120, img: "เจม.png", color: "#ffd700" }, // ใหม่!
        { name: "Aeria Celestial", rarity: "SSR", income: 110, img: "เจดี.png", color: "#ffd700" }, // ใหม่!
        { name: "Akemi Homura", rarity: "SSR", income: 105, img: "เอ.png", color: "#ffd700" }, // ใหม่!
        { name: "Crystal Queen", rarity: "SSR", income: 100, img: "ko.png", color: "#ffd700" }, // ใหม่!
        { name: "Azure Knight", rarity: "SSR", income: 100, img: "li.png", color: "#ffd700" }, // ใหม่!
        { name: "Galaxy Maiden", rarity: "SSR", income: 100, img: "mo.png", color: "#ffd700" }, // ใหม่!
        { name: "Blooming Specter", rarity: "SSR", income: 100, img: "เด.png", color: "#ffd700" }, // ใหม่!
        { name: "The Herta", rarity: "SSR", income: 100, img: "The Herta.png", color: "#ffd700" }, // ต้นฉบับ
        { name: "Sparkle (5 Star)", rarity: "SSR", income: 100, img: "67.png", color: "#ffd700" }, // ต้นฉบับ
        { name: "Dragon Spear Ai", rarity: "SSR", income: 100, img: "ai.png", color: "#ffd700" }, // ใหม่!

        // --- ระดับ SR (Super Rare) - โอกาสออก 45% | Income: +30G ขึ้นไป ---
        { name: "Pinky Ribbon", rarity: "SR", income: 45, img: "pnm.png", color: "#3498db" }, // ใหม่!
        { name: "Sparkle (White)", rarity: "SR", income: 40, img: "1000029690.png", color: "#3498db" }, // ใหม่! ร่างขาวขี้เล่น
        { name: "Short Hair Style", rarity: "SR", income: 40, img: "po.png", color: "#3498db" }, // ใหม่!
        { name: "Fox Mask GF", rarity: "SR", income: 40, img: "gf.png", color: "#3498db" }, // ใหม่!
        { name: "Mage Apprentice", rarity: "SR", income: 35, img: "mk.png", color: "#3498db" }, // ใหม่!
        { name: "Twin Tails Blue", rarity: "SR", income: 35, img: "lo.png", color: "#3498db" }, // ใหม่!
        { name: "Sparcy", rarity: "SR", income: 30, img: "Sparcy.png", color: "#3498db" }, // ต้นฉบับ
        { name: "Aether Siege Ki", rarity: "SR", income: 30, img: "ki.jpeg", color: "#3498db" }, // ต้นฉบับ
        { name: "Shadow Lance Kj", rarity: "SR", income: 30, img: "kj.jpeg", color: "#3498db" }, // ต้นฉบับ
        { name: "Mage Herta", rarity: "SR", income: 30, img: "the.png", color: "#3498db" }, // ต้นฉบับ
        { name: "Alice Cards 55", rarity: "SR", income: 30, img: "55.png", color: "#3498db" }, // ใหม่!

        // --- ระดับ R (Rare) - โอกาสออก 40% | Income: +5G ขึ้นไป ---
        { name: "The Chaos Wing", rarity: "R", income: 15, img: "เก.png", color: "#95a5a6" }, // ใหม่!
        { name: "Pixel Ghost", rarity: "R", income: 10, img: "pgn.png", color: "#95a5a6" }, // ใหม่!
        { name: "The Derp Face", rarity: "R", income: 10, img: "mpo.png", color: "#95a5a6" }, // ใหม่!
        { name: "JJK Member", rarity: "R", income: 5, img: "jjkl.png", color: "#95a5a6" } // ต้นฉบับ
    ];

    // เริ่มเกม
    document.getElementById('start-btn').onclick = function() {
        myName = document.getElementById('login-input').value.trim();
        if(!myName) return alert("ใส่ชื่อด้วยจ้า!");
        
        document.getElementById('login-screen').style.display = "none";
        document.getElementById('viewport').style.display = "block";

        // โหลดข้อมูลจาก Firebase
        db.ref('users/' + myName).once('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                gold = Number.isFinite(data.gold) ? data.gold : 100;
                inventory = data.inventory || [];
                playerX = data.x || 300;
            } else {
                gold = 200; // เริ่มต้นให้เยอะหน่อยไว้วิ่งสุ่ม
            }
            initGame();
        });
    };

    function initGame() {
        // Sync ข้อมูลตัวเองขึ้น Firebase (Real-time)
        setInterval(() => {
            db.ref('users/' + myName).update({
                x: playerX,
                img: currentImg,
                gold: gold,
                inventory: inventory,
                lastSeen: Date.now()
            });
        }, 100); // อัปเดตทุก 0.1 วินาที

        // Multiplayer: ฟังข้อมูลผู้เล่นคนอื่น
        db.ref('users').on('value', (snapshot) => {
            const users = snapshot.val();
            const world = document.getElementById('world');
            const now = Date.now();

            // จัดการตัวละครบนแผนที่
            for(let id in users) {
                const u = users[id];
                
                // ลบผู้เล่นที่ออฟไลน์นาน (10 วินาที)
                if(now - u.lastSeen > 10000) {
                    const oldNode = document.getElementById('p-' + id);
                    if(oldNode) oldNode.remove();
                    continue;
                }

                let pDiv = document.getElementById('p-' + id);
                if(!pDiv) {
                    // สร้าง Node ใหม่ถ้ายังไม่มี
                    pDiv = document.createElement('div');
                    pDiv.id = 'p-' + id;
                    pDiv.className = 'player-node';
                    pDiv.innerHTML = `<div class="player-label">${id}</div><img src="${u.img}">`;
                    world.appendChild(pDiv);
                }
                
                // อัปเดตตำแหน่งและรูปภาพ
                pDiv.style.left = u.x + "px";
                pDiv.querySelector('img').src = u.img;
            }

            // ระบบกล้อง: เลื่อนโลกตามตัวผู้เล่น
            const camX = (window.innerWidth / 2) - (playerX + 75); // 75 คือครึ่งความกว้างตัวละคร
            world.style.left = camX + "px";

            // อัปเดต UI
            document.getElementById('money-val').innerText = gold.toLocaleString();
            
            // แสดงปุ่ม Action เมื่ออยู่ใกล้จุดทำภารกิจ
            const distToShowcase = Math.abs(playerX - 600);
            const distToGacha = Math.abs(playerX - 1800);
            
            document.getElementById('btn-showcase').style.display = distToShowcase < 150 ? "block" : "none";
            document.getElementById('btn-gacha').style.display = distToGacha < 150 ? "block" : "none";
        });

        // ระบบ Passive Income: ได้เงินจากการ์ดใน Collection ทุก 3 วินาที
        setInterval(() => {
            let totalIncome = 0;
            inventory.forEach(item => {
                totalIncome += item.income;
            });
            if(totalIncome > 0) {
                gold += totalIncome;
                // อัปเดต UI ทันที
                document.getElementById('money-val').innerText = gold.toLocaleString();
            }
        }, 3000); // ทุก 3 วินาที
    }

    // --- ระบบเดิน ---
    let walkInterval = null;
    function startWalk(dir) {
        if(walkInterval) return; // ป้องกันการเดินซ้อน
        walkInterval = setInterval(() => {
            if(dir === 'L') {
                playerX -= 18;
                currentImg = "ap.png"; // รูปเดินซ้าย
            } else {
                playerX += 18;
                currentImg = "as.png"; // รูปเดินขวา
            }
            
            // จำกัดขอบเขตแผนที่
            if(playerX < 0) playerX = 0;
            if(playerX > 4800) playerX = 4800; // เผื่อความกว้างตัวละครนิดหน่อย

        }, 40); // ความเร็วในการก้าว
    }
    function stopWalk() {
        clearInterval(walkInterval);
        walkInterval = null;
        currentImg = "au.png"; // กลับมายืนนิ่ง
    }

    // ควบคุมด้วยปุ่มเดิน
    document.getElementById('leftBtn').onpointerdown = () => startWalk('L');
    document.getElementById('rightBtn').onpointerdown = () => startWalk('R');
    window.onpointerup = stopWalk; // หยุดเดินเมื่อยกนิ้วขึ้น (ทั่วหน้าจอ)

    // --- ระบบสุ่มกาชา (DRAW) ---
    document.getElementById('draw-btn').onclick = () => {
        if(gold < 50) return alert("ทองไม่พอจ้า!");
        
        gold -= 50; // หักเงิน
        
        // สุ่มแบบมีน้ำหนัก (Weighted Random)
        const rand = Math.random();
        let rolledCard;

        if(rand < 0.03) { // UR 3%
            rolledCard = cardPool[Math.floor(Math.random() * 2)]; // สุ่ม Hanabi หรือ Red
        } else if(rand < 0.15) { // SSR 12%
            rolledCard = cardPool[Math.floor(Math.random() * 10) + 2]; // ตั้งแต่ Luna ถึง Ai
        } else if(rand < 0.60) { // SR 45%
            rolledCard = cardPool[Math.floor(Math.random() * 11) + 12]; // ตั้งแต่ Pinky ถึง 55
        } else { // R 40%
            rolledCard = cardPool[Math.floor(Math.random() * 4) + 23]; // ตั้งแต่ Chaos ถึง JJK
        }

        // เพิ่มลงในคอลเลกชัน
        inventory.push(rolledCard);
        
        // แสดงผล
        document.getElementById('gacha-result').innerHTML = `
            <div class="gacha-result-card" style="border-color: ${rolledCard.color}">
                <img src="${rolledCard.img}">
                <h3>${rolledCard.name}</h3>
                <h2 style="color:${rolledCard.color}">${rolledCard.rarity}</h2>
                <p>Passive Income: +${rolledCard.income} G</p>
            </div>`;
    };

    // --- ระบบตู้โชว์ (Collection) ---
    function openShowcase() {
        const grid = document.getElementById('collection-grid');
        grid.innerHTML = ""; // เคลียร์ของเก่า

        // ถ้าไม่มีของเลย
        if(inventory.length === 0) {
            grid.innerHTML = "<div style='color:#aaa; grid-column: 1/-1; text-align:center;'>ยังไม่มีการ์ดสะสมเลย สุ่มกาชาสิ!</div>";
        } else {
            // เรียงการ์ดตามระดับความแรร์ (UR > SSR > SR > R) ก่อนแสดง
            const rarityOrder = { "UR": 0, "SSR": 1, "SR": 2, "R": 3 };
            const sortedInventory = [...inventory].sort((a, b) => rarityOrder[a.rarity] - rarityOrder[b.rarity]);

            sortedInventory.forEach(item => {
                grid.innerHTML += `
                    <div class="slot-card" style="border-color: ${item.color}">
                        <img src="${item.img}">
                        <div style="color:${item.color}; font-size:11px; font-weight:bold; margin-top:5px;">${item.rarity}</div>
                    </div>`;
            });
        }
        
        document.getElementById('overlay-showcase').style.display = "flex";
    }

    // ปุ่ม Action เปิด UI
    document.getElementById('btn-gacha').onclick = () => {
        document.getElementById('gacha-result').innerHTML = "<h2 style='color:white; text-shadow: 0 0 5px rgba(255,255,255,0.3);'>พร้อมเสี่ยงโชคหรือยัง?</h2>";
        document.getElementById('overlay-gacha').style.display = "flex";
    };
    document.getElementById('btn-showcase').onclick = openShowcase;

    // ฟังก์ชันปิด UI ทั้งหมด
    window.closeUI = () => {
        document.querySelectorAll('.overlay').forEach(e => e.style.display="none");
    };
</script>
</body>
</html>
